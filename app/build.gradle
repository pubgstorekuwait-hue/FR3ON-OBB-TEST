plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fr3on.obbtest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fr3on.obbtest'

        // دعم Android 6 وما بعده
        minSdk 23

        // استهداف Android 15
        targetSdk 35

        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
